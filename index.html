<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Фотоотчёты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1b1b1b);
    --hint: var(--tg-theme-hint-color, #7b7f85);
    --accent: var(--tg-theme-button-color, #2f7de1);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f0f2f4);
    --danger: #d64545;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }

  .tabs { display: flex; background: var(--card); border-radius: 12px; padding: 3px; margin-bottom: 20px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--hint);
    padding: 10px 8px; border-radius: 10px; font: inherit; font-weight: 600; }
  .tabs button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  label.cap { display: block; font-size: 14px; color: var(--hint); margin: 0 0 6px; }
  .row { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type=text], textarea { width: 100%; border: 2px solid transparent; background: var(--card);
    color: var(--text); border-radius: 12px; padding: 14px; font: inherit; }
  #item { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 84px; resize: vertical; margin: 16px 0; }

  button.primary, button.scan { border: 0; border-radius: 12px; font: inherit; font-weight: 700; padding: 14px 18px; }
  button.primary { width: 100%; background: var(--accent); color: var(--accent-text); }
  button.scan { background: var(--accent); color: var(--accent-text); white-space: nowrap; }
  button:disabled { opacity: .5; }
  button:focus-visible, .add:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--card); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border: 0;
    border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 16px; line-height: 1; }
  .add { display: flex; align-items: center; justify-content: center; gap: 8px; border: 2px dashed var(--hint);
    border-radius: 12px; padding: 16px; font-weight: 600; color: var(--text); cursor: pointer; }
  .count { color: var(--hint); font-size: 14px; margin: 0 0 8px; }

  #msg { margin-top: 16px; text-align: center; font-weight: 600; min-height: 22px; }
  #msg.err { color: var(--danger); }

  .report { background: var(--card); border-radius: 14px; padding: 12px; margin-top: 14px; }
  .report .meta { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  .report .by { color: var(--hint); font-weight: 400; }
  .report .note { margin: 6px 0 0; }
  .report .thumbs { margin: 10px 0 0; }
  .report .thumb { cursor: zoom-in; }
  .empty { color: var(--hint); text-align: center; margin-top: 28px; }

  #scanner { position: fixed; inset: 0; background: #000; z-index: 10; display: flex; flex-direction: column; }
  #scanner video { flex: 1; width: 100%; object-fit: cover; min-height: 0; }
  #scanner .frame { position: absolute; left: 10%; right: 10%; top: 32%; height: 22%;
    border: 3px solid #fff; border-radius: 14px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); pointer-events: none; }
  #scanner .bar { padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; color: #fff; }
  #scanner .bar button { border: 0; background: #fff; color: #000; font: inherit; font-weight: 700;
    padding: 12px 28px; border-radius: 12px; }

  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 20; display: flex;
    align-items: center; justify-content: center; }
  #viewer img { max-width: 100%; max-height: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="tabs">
    <button data-tab="new" class="on">Новый отчёт</button>
    <button data-tab="find">Найти по номеру</button>
  </div>

  <label class="cap" for="item">Номер товара</label>
  <div class="row">
    <input id="item" type="text" inputmode="numeric" autocomplete="off" placeholder="Номер или штрихкод">
    <button id="scanBtn" class="scan" type="button">Сканировать</button>
  </div>

  <section id="new">
    <p class="count" id="count"></p>
    <div id="thumbs" class="thumbs"></div>
    <label class="add">
      Сделать фото
      <input id="file" type="file" accept="image/*" capture="environment" multiple hidden>
    </label>
    <textarea id="comment" placeholder="Комментарий о состоянии (необязательно)"></textarea>
    <button id="send" class="primary" type="button">Отправить отчёт</button>
  </section>

  <section id="find" hidden>
    <button id="search" class="primary" type="button">Показать историю</button>
    <div id="results"></div>
  </section>

  <div id="msg" role="status"></div>
</main>

<div id="scanner" hidden>
  <video id="video" playsinline muted></video>
  <div class="frame"></div>
  <div class="bar">
    <span>Наведите камеру на штрихкод</span>
    <button id="cancelScan" type="button">Отмена</button>
  </div>
</div>

<div id="viewer" hidden><img alt="Фото"></div>

<script>
const API = "https://fqtceotpcoruledtzvlc.supabase.co/functions/v1/api";
const MAX_PHOTOS = 10;

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const $ = (id) => document.getElementById(id);
let mode = "new";
let photos = []; // сжатые фото (Blob)
let reader = null;

function msg(text, isError) {
  $("msg").textContent = text || "";
  $("msg").className = isError ? "err" : "";
}

if (!tg.initData) {
  msg("Откройте приложение из Телеграма через бота.", true);
}

/* ---------- Вкладки ---------- */
document.querySelectorAll(".tabs button").forEach((b) => {
  b.onclick = () => {
    mode = b.dataset.tab;
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
    $("new").hidden = mode !== "new";
    $("find").hidden = mode !== "find";
    msg("");
  };
});

/* ---------- Сканер штрихкода ---------- */
function stopScan() {
  if (reader) { try { reader.reset(); } catch (e) {} reader = null; }
  $("scanner").hidden = true;
}

$("scanBtn").onclick = () => {
  msg("");
  $("scanner").hidden = false;
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
    ZXing.BarcodeFormat.UPC_A,
  ]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  reader = new ZXing.BrowserMultiFormatReader(hints);
  reader
    .decodeFromConstraints({ video: { facingMode: "environment" } }, $("video"), (result) => {
      if (!result) return;
      const code = result.getText();
      stopScan();
      $("item").value = code;
      if (navigator.vibrate) navigator.vibrate(80);
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      if (mode === "find") doSearch();
    })
    .catch(() => {
      stopScan();
      msg("Не удалось открыть камеру. Введите номер вручную.", true);
    });
};
$("cancelScan").onclick = stopScan;

/* ---------- Фото ---------- */
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob((b) => (b ? resolve(b) : reject()), "image/jpeg", 0.85);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function renderThumbs() {
  const box = $("thumbs");
  box.textContent = "";
  photos.forEach((blob, i) => {
    const d = document.createElement("div");
    d.className = "thumb";
    const im = document.createElement("img");
    im.src = URL.createObjectURL(blob);
    const x = document.createElement("button");
    x.type = "button";
    x.textContent = "×";
    x.setAttribute("aria-label", "Удалить фото");
    x.onclick = () => { photos.splice(i, 1); renderThumbs(); };
    d.append(im, x);
    box.append(d);
  });
  $("count").textContent = photos.length ? `Фото: ${photos.length} из ${MAX_PHOTOS}` : "";
}

$("file").onchange = async (e) => {
  const files = [...e.target.files];
  e.target.value = "";
  for (const f of files) {
    if (photos.length >= MAX_PHOTOS) { msg(`Не больше ${MAX_PHOTOS} фото за раз.`, true); break; }
    try { photos.push(await compress(f)); } catch (err) { msg("Не удалось обработать фото.", true); }
  }
  renderThumbs();
};

/* ---------- Запросы к серверу ---------- */
async function call(action, extra) {
  const fd = new FormData();
  fd.append("initData", tg.initData);
  fd.append("action", action);
  fd.append("item_number", $("item").value.trim());
  if (extra) extra(fd);
  const r = await fetch(API, { method: "POST", body: fd });
  const j = await r.json().catch(() => ({ error: "Сервер вернул непонятный ответ." }));
  if (!r.ok) throw new Error(j.error || "Ошибка сервера");
  return j;
}

/* ---------- Отправка отчёта ---------- */
$("send").onclick = async () => {
  if (!$("item").value.trim()) return msg("Укажите номер товара.", true);
  if (!photos.length) return msg("Добавьте хотя бы одно фото.", true);
  $("send").disabled = true;
  msg("Отправляю…");
  try {
    await call("upload", (fd) => {
      fd.append("comment", $("comment").value.trim());
      photos.forEach((b, i) => fd.append("photos", b, `${i + 1}.jpg`));
    });
    const num = $("item").value.trim();
    photos = [];
    renderThumbs();
    $("comment").value = "";
    $("item").value = "";
    msg(`Отчёт по товару ${num} отправлен.`);
    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  } catch (e) {
    msg(e.message, true);
  } finally {
    $("send").disabled = false;
  }
};

/* ---------- Поиск истории ---------- */
function openViewer(url) {
  $("viewer").querySelector("img").src = url;
  $("viewer").hidden = false;
}
$("viewer").onclick = () => { $("viewer").hidden = true; };

async function doSearch() {
  const num = $("item").value.trim();
  if (!num) return msg("Укажите номер товара.", true);
  $("search").disabled = true;
  $("results").textContent = "";
  msg("Ищу…");
  try {
    const { reports } = await call("history");
    msg("");
    if (!reports.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = `По товару ${num} фотоотчётов пока нет.`;
      $("results").append(p);
      return;
    }
    reports.forEach((r) => {
      const card = document.createElement("div");
      card.className = "report";
      const meta = document.createElement("div");
      meta.className = "meta";
      const date = document.createElement("span");
      date.textContent = new Date(r.created_at).toLocaleString("ru-RU", {
        day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit",
      });
      const by = document.createElement("span");
      by.className = "by";
      by.textContent = r.author_name || "";
      meta.append(date, by);
      card.append(meta);
      if (r.comment) {
        const n = document.createElement("p");
        n.className = "note";
        n.textContent = r.comment;
        card.append(n);
      }
      const grid = document.createElement("div");
      grid.className = "thumbs";
      (r.photo_urls || []).forEach((u) => {
        const t = document.createElement("div");
        t.className = "thumb";
        const im = document.createElement("img");
        im.src = u;
        im.loading = "lazy";
        t.onclick = () => openViewer(u);
        t.append(im);
        grid.append(t);
      });
      card.append(grid);
      $("results").append(card);
    });
  } catch (e) {
    msg(e.message, true);
  } finally {
    $("search").disabled = false;
  }
}
$("search").onclick = doSearch;
</script>
</body>
</html>
